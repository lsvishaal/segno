[workspace]
resolver = "3"
# `crates/*` are libraries; the application lives in `app/`, alongside the
# frontend it serves. Tauri's own convention puts the Rust half in
# `src-tauri/`, and following it keeps every Tauri example and generator
# applicable to this repository.
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Hogwash contributors"]

# Verovio is LGPL-3.0, which would have constrained this had it
# been linked in. It is not: it is a separate, replaceable shared library
# opened at run time, which is what section 4 of LGPL-3.0 asks for and what
# leaves Hogwash's own code free. Apache-2.0 over MIT for the explicit patent
# grant.
#
# Verovio's own notices ship with the application. THIRD_PARTY.md records
# that obligation, and scripts/check-native-licences.sh enforces it —
# `cargo deny` cannot, because Verovio is not a cargo dependency.
license = "Apache-2.0"

# `repository` is still unset until a remote actually exists. Guessing it
# from the local git identity would be unverified metadata.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# `just run` is a debug build. Dependencies (Tauri, serde, the XML parser) are
# optimised once and cached, so the app runs near release speed while our own
# crates still rebuild fast. The two engine crates that replay history and
# parse scores get the same, since they do the heavy lifting on every open.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.hogwash-analysis]
opt-level = 2

[profile.dev.package.hogwash-notation]
opt-level = 2

# What ships: no symbol table, 13.9 MB -> 9.2 MB. Panic messages keep their
# file and line. LTO was measured (7.3 MB fat, 9.3 MB thin) and left off:
# no measurable run-time gain, and fat LTO made a release rebuild 17 s -> 83 s.
[profile.release]
strip = true
