[workspace]
resolver = "3"
# `crates/*` are libraries; the application lives in `app/`, alongside the
# frontend it serves. Tauri's own convention puts the Rust half in
# `src-tauri/`, and following it keeps every Tauri example and generator
# applicable to this repository.
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Hogwash contributors"]

# ADR-0007. Verovio is LGPL-3.0, which would have constrained this had it
# been linked in. It is not: it is a separate, replaceable shared library
# opened at run time (ADR-0005), which is what LGPL-3.0 §4 asks for and what
# leaves Hogwash's own code free. Apache-2.0 over MIT for the explicit patent
# grant.
#
# Verovio's own notices ship with the application. THIRD_PARTY.md records
# that obligation, and scripts/check-native-licences.sh enforces it —
# `cargo deny` cannot, because Verovio is not a cargo dependency.
license = "Apache-2.0"

# `repository` is still unset until a remote actually exists. Guessing it
# from the local git identity would be unverified metadata.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
