[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Hogwash contributors"]

# `license` is deliberately unset. Product_Discovery.md §3 commits to
# open source without naming a licence, and the choice interacts with the
# deferred engraving decision — Verovio is LGPL-3.0, and static linking
# against it carries obligations that constrain what Hogwash may be
# licensed as. Both are settled together in the S1 spike's ADRs.
#
# `repository` is also unset until a remote actually exists. Guessing it
# from the local git identity would be unverified metadata.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
