[package]
name = "segno-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "The application shell: Tauri commands over the Rust core, and the window the performer sees."

# `main.rs` is a thin wrapper around `lib.rs` so the command layer can be
# tested, and so a future mobile target has a library entry point to call.
[lib]
name = "segno_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
segno-acquisition = { path = "../../crates/segno-acquisition" }
segno-analysis = { path = "../../crates/segno-analysis" }
segno-capture = { path = "../../crates/segno-capture" }
segno-domain = { path = "../../crates/segno-domain" }
segno-engraving = { path = "../../crates/segno-engraving" }
segno-engraving-verovio = { path = "../../crates/segno-engraving-verovio" }
segno-feedback = { path = "../../crates/segno-feedback" }
segno-library = { path = "../../crates/segno-library" }
segno-midi = { path = "../../crates/segno-midi" }
segno-notation = { path = "../../crates/segno-notation" }
segno-practice = { path = "../../crates/segno-practice" }
segno-records = { path = "../../crates/segno-records" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
segno-library = { path = "../../crates/segno-library" }
segno-records = { path = "../../crates/segno-records" }

[lints]
workspace = true
