[package]
name = "hogwash-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "The application shell: Tauri commands over the Rust core, and the window the performer sees."

# `main.rs` is a thin wrapper around `lib.rs` so the command layer can be
# tested, and so a future mobile target has a library entry point to call.
[lib]
name = "hogwash_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hogwash-acquisition = { path = "../../crates/hogwash-acquisition" }
hogwash-analysis = { path = "../../crates/hogwash-analysis" }
hogwash-capture = { path = "../../crates/hogwash-capture" }
hogwash-domain = { path = "../../crates/hogwash-domain" }
hogwash-engraving = { path = "../../crates/hogwash-engraving" }
hogwash-engraving-verovio = { path = "../../crates/hogwash-engraving-verovio" }
hogwash-feedback = { path = "../../crates/hogwash-feedback" }
hogwash-library = { path = "../../crates/hogwash-library" }
hogwash-midi = { path = "../../crates/hogwash-midi" }
hogwash-notation = { path = "../../crates/hogwash-notation" }
hogwash-practice = { path = "../../crates/hogwash-practice" }
hogwash-records = { path = "../../crates/hogwash-records" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
