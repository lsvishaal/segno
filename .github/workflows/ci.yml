name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux only (D3). Windows CI returns with Next 6.
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # What Tauri v2 links against on Linux (WebKitGTK 4.1 brings glib and
      # libsoup), plus ALSA for the MIDI adapter.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev

      # rust-toolchain.toml pins the version; rustup honours it.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies
        run: npm ci
        working-directory: app

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny

      - name: Gate
        run: just ci

  # Verovio is deliberately NOT part of the job above. The design loads it at
  # run time so that building and testing Hogwash needs no C++ toolchain —
  # and a gate that quietly required one would give that property away
  # without anyone deciding to.
  #
  # So it gets its own job: build the engine once, cache it, and run the
  # handful of tests that genuinely cannot be faked.
  engraving:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Pinned by commit, not by tag: the repository's tag and the
      # toolkit's own reported version disagree, and the toolkit is right.
      - name: Clone Verovio
        run: |
          git clone --filter=blob:none https://github.com/rism-digital/verovio.git ../verovio
          git -C ../verovio checkout fb5c4db7e

      - name: Cache the built engine
        id: engine
        uses: actions/cache@v4
        with:
          path: .verovio-build/libverovio.so
          key: verovio-fb5c4db7e-${{ runner.os }}

      - name: Build Verovio
        if: steps.engine.outputs.cache-hit != 'true'
        run: just verovio-build ../verovio

      - name: Against a real engine
        run: |
          export HOGWASH_VEROVIO_LIB="$PWD/.verovio-build/libverovio.so"
          export HOGWASH_VEROVIO_DATA="$PWD/../verovio/data"
          just engraving-test
          just engraving-determinism
