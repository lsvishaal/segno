[package]
name = "hogwash-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "The application: the score, the cursor, and what happened."

[dependencies]
hogwash-acquisition = { path = "../hogwash-acquisition" }
hogwash-analysis = { path = "../hogwash-analysis" }
hogwash-capture = { path = "../hogwash-capture" }
hogwash-domain = { path = "../hogwash-domain" }
hogwash-engraving = { path = "../hogwash-engraving" }
hogwash-engraving-verovio = { path = "../hogwash-engraving-verovio" }
hogwash-feedback = { path = "../hogwash-feedback" }
hogwash-library = { path = "../hogwash-library" }
hogwash-midi = { path = "../hogwash-midi" }
hogwash-notation = { path = "../hogwash-notation" }
hogwash-practice = { path = "../hogwash-practice" }
hogwash-records = { path = "../hogwash-records" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
resvg = "0.44"
rfd = "0.15"
sha2 = "0.10"

[lints]
workspace = true
