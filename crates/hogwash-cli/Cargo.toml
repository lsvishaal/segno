[package]
name = "hogwash-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Determinism harness, and replay of real scores through the practice path without a keyboard. Not a product surface."

[dependencies]
