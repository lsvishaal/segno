# cargo-deny configuration.
#
# SCOPE — read this before trusting the gate.
# cargo-deny evaluates *normal* dependencies. It does NOT evaluate
# dev-dependencies. A copyleft crate added under [dev-dependencies] will
# pass this check. Verify the gate against a normal dependency, never a
# dev one, or the verification proves nothing.

[graph]
all-features = true

[licenses]
# Permissive only.
#
# This list was expected to need amending for Verovio's LGPL-3.0. It did not:
# The design loads Verovio at run time, so it never enters the Cargo graph and
# cargo-deny cannot see it at all. That gap is covered by
# scripts/check-native-licences.sh and THIRD_PARTY.md instead — see the design.
#
# It briefly carried MPL-2.0 and two font licences, admitted for `resvg`,
# `usvg` and egui's bundled typefaces. The design replaced that interface with a
# webview, so none of those crates is in the graph any more and the
# exemptions were removed rather than left behind. An allow-list that outlives
# its reasons stops being a record of decisions and becomes a list of things
# nobody dares delete.
#
# MPL-2.0 is here again after that reset, which is the point of re-deriving
# rather than inheriting: the crates and the reason both changed. It now
# covers `cssparser`, `cssparser-macros`, `dtoa-short` and `option-ext`,
# reached through `wry`'s webview bindings and through `dirs`.
#
# It is accepted because it is copyleft **per file**, not per program. Using
# the crates imposes nothing on Hogwash's own code; only modifications to
# their files would have to be published under MPL-2.0, and we make none.
# Their source is on crates.io, which discharges the availability obligation.
#
# The distinction that matters: MPL-2.0 restricts what we may do to *their*
# files; a GPL-family licence would restrict what we may do to *ours*.
#
# Anything added here is added deliberately, with the reason written down. The
# canary in scripts/verify-licence-gate.sh exists to prove the list still
# refuses a GPL-family crate.
allow = [
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.93

# Our own workspace crates carry no `license` field, because Hogwash's
# licence is not chosen yet (see Cargo.toml). They are `publish = false`,
# so they are exempt: this allow-list exists to police third-party code,
# not to make us declare a licence before we have decided on one.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

# A path dependency carries no version requirement, so cargo-deny counts it
# as a wildcard. The ban is aimed at `foo = "*"` from a registry, where an
# unpinned range means a future release can change under us without warning.
# A sibling crate in this workspace has no such range — it is whatever is on
# disk at this commit. Registry wildcards remain denied.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

# Nothing is ignored.
#
# Two `unmaintained` advisories were accepted here for `ttf-parser` and
# `rustybuzz`, the text-shaping layer beneath egui and resvg. The design moved
# the interface to a webview, which draws its own text, so neither crate is in
# the graph and both exemptions were removed with the reason that justified
# them.
#
# An `ignore` entry is a decision to run with a known problem, and it should
# have to be re-argued rather than inherited. So these were re-argued.
#
# Sixteen advisories, and **every one is `unmaintained`** — not a single
# vulnerability among them. They are the GTK3 bindings Tauri uses for its
# Linux window (`gtk`, `gdk`, `atk`, `glib-sys` and friends), plus
# `proc-macro-error` and the `unic-*` Unicode tables reached through them.
#
# Why they are accepted rather than avoided: they are not a dependency anyone
# chose, they are what Tauri v2 is built on for Linux. Removing them means
# removing Tauri. The upstream direction of travel is GTK4, and Tauri will
# arrive there on its own schedule.
#
# What the exposure actually is, rather than a wave: these crates parse and
# draw the *application's own window furniture*, not anything a performer
# supplies. What is attacker-shaped is a MusicXML file, and that reaches
# Verovio and then the webview's SVG parser — neither of which is on this
# list. Against even that: the requirements make Hogwash entirely offline, so
# a hostile file must be deliberately obtained and opened, and there is
# nothing for it to exfiltrate to.
#
# Reviewed if: any of these turns into a *vulnerability* advisory; Tauri moves
# to GTK4 and they leave the graph; or Hogwash gains any network capability,
# which would change the reasoning above entirely.
ignore = [
    # GTK3 bindings, beneath Tauri's Linux window.
    { id = "RUSTSEC-2024-0411", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0412", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0413", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0414", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0415", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0416", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0417", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0418", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0419", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-rs GTK3 binding, unmaintained; Tauri v2's Linux backend" },

    # Reached through those bindings and through Tauri's macros.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, no known defect; build-time only" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained, no known defect; Unicode tables" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* unmaintained, no known defect; Unicode tables" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained, no known defect; Unicode tables" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* unmaintained, no known defect; Unicode tables" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* unmaintained, no known defect; Unicode tables" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
